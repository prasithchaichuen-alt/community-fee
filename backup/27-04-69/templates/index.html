<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เมนูหลัก - ชุมชนเอื้ออาทรริมกก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; font-family: sans-serif; }
        .main-card { border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; max-width: 500px; margin: auto; }
        .btn-option { padding: 20px; font-weight: bold; border-radius: 15px; transition: 0.3s; font-size: 1.2rem; }
        .btn-option:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .admin-link { text-decoration: none; color: #adb5bd; font-size: 0.8rem; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card main-card p-4">
            <div class="text-center mb-5">
                <small class="text-muted text-uppercase fw-bold" style="letter-spacing: 2px;">MANAGEMENT SYSTEM</small>
                <h2 class="text-primary fw-bold mt-2">ชุมชนเอื้ออาทรริมกก</h2>
                <div class="mx-auto" style="width: 60px; height: 4px; background: #0d6efd; border-radius: 10px;"></div>
            </div>

            <div class="row g-4">
                {% if settings.get('btn_payment') == 1 %}
                <div class="col-12">
                    <a href="/payment" class="btn btn-success w-100 btn-option shadow-sm border-0">
                        🏠 ๑. บันทึกรับค่าส่วนกลาง
                    </a>
                </div>
                {% endif %}

                {% if settings.get('btn_expense') == 1 %}
                <div class="col-12">
                    <a href="/expense" class="btn btn-danger w-100 btn-option shadow-sm border-0">
                        💸 ๒. ลงบันทึกรายจ่าย
                    </a>
                </div>
                {% endif %}

                {% if settings.get('btn_project') == 1 %}
                <div class="col-12">
                    <a href="/projects" class="btn btn-primary w-100 btn-option shadow-sm border-0">
                        📋 ๓. โครงการเพิ่มเติม
                    </a>
                </div>
                {% endif %}
            </div>

            <div class="text-center mt-5">
                <a href="#" onclick="enterAdmin()" class="admin-link">⚙️ ระบบจัดการสำหรับ ADMIN</a>
            </div>
        </div>
    </div>

    <script>
    function enterAdmin() {
        const password = prompt("กรุณาใส่รหัสผ่านผู้ดูแลระบบ:");
        if (password === "1234") { window.location.href = "/admin"; }
        else if (password !== null) { alert("รหัสผ่านไม่ถูกต้อง!"); }
    }
    </script>
</body>
</html>
